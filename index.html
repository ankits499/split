    />
    <title>Split</title>
    <script>
      // Restore the real path after public/404.html's redirect (see that
      // file for why this exists). No-op outside of that redirect flow.
      ;(function () {
        var params = new URLSearchParams(location.search)
        var redirect = params.get('redirect')
        if (redirect) {
          history.replaceState(null, '', location.pathname + redirect)
        }
      })()
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
